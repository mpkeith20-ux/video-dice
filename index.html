<!-- === MK Giant Video Die • Cosmic Look • Random 6 • No Repeats • Modal === -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MK Video Dice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="mkDiceWork">
  <div class="scene" id="mkScene" role="button" tabindex="0" aria-label="Roll the die">
    <div class="cube" id="mkCube">
      <!-- Faces (video tags get preview src from JS) -->
      <div class="face front"><video muted autoplay loop playsinline preload="auto"></video></div>
      <div class="face back"><video muted autoplay loop playsinline preload="auto"></video></div>
      <div class="face right"><video muted autoplay loop playsinline preload="auto"></video></div>
      <div class="face left"><video muted autoplay loop playsinline preload="auto"></video></div>
      <div class="face top"><video muted autoplay loop playsinline preload="auto"></video></div>
      <div class="face bottom"><video muted autoplay loop playsinline preload="auto"></video></div>
    </div>
  </div>
  <div class="mk-die-label">Click (or press Enter/Space) to roll</div>
</div>

<!-- Modal Player -->
<div class="mk-modal" id="mkModal" aria-modal="true" role="dialog">
  <div class="mk-sheet">
    <button class="mk-close" id="mkClose" aria-label="Close">×</button>
    <div class="mk-aspect">
      <video id="mkVid" controls playsinline preload="auto"></video>
      <div class="mk-text">
        <div class="mk-brand" id="mkBrand">Brand</div>
        <div class="mk-spot"  id="mkSpot">Spot</div>
      </div>
    </div>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
