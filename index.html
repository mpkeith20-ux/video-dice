<!-- === MK Giant Video Die • Cosmic Look • Random 6 • No Repeats • Modal === -->
<style>
  /* --- Cosmic backdrop (scoped to this section only) --- */
  #mkDiceWork {
    display:grid; place-items:center; gap:24px; padding:60px 0 80px;
    position:relative;
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(90,130,255,.18), transparent 60%),
      radial-gradient(800px 500px at 15% 20%, rgba(255,255,255,.06), transparent 60%),
      radial-gradient(1000px 600px at 85% 25%, rgba(255,255,255,.05), transparent 65%),
      linear-gradient(#0a0a0f, #06060b 55%, #050509 100%);
  }
  /* Stars / dust */
  #mkDiceWork::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,.25), transparent 60%),
      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.25), transparent 60%),
      radial-gradient(1px 1px at 85% 65%, rgba(255,255,255,.2),  transparent 60%),
      radial-gradient(2px 2px at 55% 15%, rgba(255,255,255,.2),  transparent 60%);
    opacity:.6;
  }

  /* --- Stage + glow/reflection --- */
  .scene {
    width:520px; height:520px; perspective:1400px; position:relative; cursor:pointer; z-index:1;
  }
  /* Floor glow + faint reflected “bloom” */
  .scene::after{
    content:""; position:absolute; left:50%; bottom:-36px; transform:translateX(-50%);
    width:120%; height:60px; border-radius:50%;
    background:
      radial-gradient(ellipse at center, rgba(255,255,255,.20), rgba(0,0,0,0) 70%);
    filter: blur(28px);
    opacity:.55; pointer-events:none;
  }

  /* --- Cube (no idle; clean first roll) --- */
  .cube {
    width:100%; height:100%;
    position:relative; transform-style:preserve-3d;
    transform:rotateX(-10deg) rotateY(22deg);       /* initial tilt so it never looks flat */
    transition:transform 3.2s cubic-bezier(.2,.7,.15,1);
    will-change:transform;
  }
  .cube.is-rolling { pointer-events:none; }

  /* WebKit reflection (adds a nice mirror below on Safari/Chrome/iOS) */
  @media screen and (-webkit-min-device-pixel-ratio:0){
    .cube {
      -webkit-box-reflect: below 14px
        linear-gradient(to bottom,
          rgba(255,255,255,.18),
          rgba(255,255,255,0) 28%,
          transparent 60%);
    }
  }

  /* --- Faces: glossy rim light + inner bloom over the PREVIEW video --- */
  .face{
    position:absolute; width:520px; height:520px; border-radius:28px; overflow:hidden;
    /* Shows very briefly before preview video paints */
    background:linear-gradient(160deg,#ffffff 0%,#f4f4f4 55%,#e8e8e8 100%);
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,.65),     /* top rim highlight */
      inset 0 -4px 16px rgba(0,0,0,.22),       /* inner bevel */
      0 22px 70px rgba(0,0,0,.55);             /* depth */
  }
  /* Soft “bloom”/glow; screen blend style effect */
  .face::before{
    content:""; position:absolute; inset:-10%;
    background:
      radial-gradient(60% 60% at 50% 45%, rgba(255,255,255,.16), transparent 65%),
      linear-gradient(to bottom, rgba(255,255,255,.10), rgba(255,255,255,0) 40%, rgba(0,0,0,.10) 95%);
    mix-blend-mode:screen; pointer-events:none;
  }
  .face video{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:brightness(.94) contrast(1.03);
    transform:translateZ(0); /* avoid subpixel seams */
  }

  /* 3D placement (half size = 260px) */
  .front  { transform: rotateY(0deg)   translateZ(260px); }
  .back   { transform: rotateY(180deg) translateZ(260px); }
  .right  { transform: rotateY(90deg)  translateZ(260px); }
  .left   { transform: rotateY(-90deg) translateZ(260px); }
  .top    { transform: rotateX(90deg)  translateZ(260px); }
  .bottom { transform: rotateX(-90deg) translateZ(260px); }

  /* Label */
  .mk-die-label{
    margin-top:72px; text-align:center; color:#eaeafa; font-weight:700; letter-spacing:.02em;
    text-shadow:0 2px 16px rgba(140,160,255,.35);
    font-size:clamp(18px,2.4vw,28px); z-index:1;
  }

  /* --- Modal player --- */
  .mk-modal {
    position:fixed; inset:0; background:rgba(0,0,0,.72);
    display:none; align-items:center; justify-content:center; z-index:9999;
  }
  .mk-modal.is-open { display:flex; }
  .mk-sheet {
    width:min(1080px,94vw); background:#0f0f14; border-radius:20px; overflow:hidden; position:relative;
    box-shadow:0 28px 100px rgba(0,0,0,.7);
  }
  .mk-aspect { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; }
  .mk-aspect video { width:100%; height:100%; object-fit:cover; display:block; }
  .mk-text { position:absolute; left:18px; bottom:14px; right:80px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .mk-brand { font-weight:800; font-size:clamp(16px,2vw,22px); }
  .mk-spot  { opacity:.9; font-size:clamp(13px,1.6vw,17px); }
  .mk-close {
    position:absolute; top:10px; right:10px; width:36px; height:36px; border:0; border-radius:999px;
    background:rgba(0,0,0,.6); color:#fff; font-size:18px; cursor:pointer;
  }
</style>

<div id="mkDiceWork">
  <div class="scene" id="mkScene" role="button" tabindex="0" aria-label="Roll the die">
    <div class="cube" id="mkCube">
      <!-- Faces (video tags get preview src from JS) -->
      <div class="face front"><video muted autoplay loop playsinline preload="auto"></video></div>
      <div class="face back"><video muted autoplay loop playsinline preload="auto"></video></div>
      <div class="face right"><video muted autoplay loop playsinline preload="auto"></video></div>
      <div class="face left"><video muted autoplay loop playsinline preload="auto"></video></div>
      <div class="face top"><video muted autoplay loop playsinline preload="auto"></video></div>
      <div class="face bottom"><video muted autoplay loop playsinline preload="auto"></video></div>
    </div>
  </div>
  <div class="mk-die-label">Click (or press Enter/Space) to roll</div>
</div>

<!-- Modal Player -->
<div class="mk-modal" id="mkModal" aria-modal="true" role="dialog">
  <div class="mk-sheet">
    <button class="mk-close" id="mkClose" aria-label="Close">×</button>
    <div class="mk-aspect">
      <video id="mkVid" controls playsinline preload="auto"></video>
      <div class="mk-text">
        <div class="mk-brand" id="mkBrand">Brand</div>
        <div class="mk-spot"  id="mkSpot">Spot</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const cube  = document.getElementById('mkCube');
  const scene = document.getElementById('mkScene');

  /* 1) MASTER BANK — add all your work here */
  const MASTER_WORKS = [
    {
      brand:"Coinbase",
      spot:"Crypto Is For Small Businesses",
      preview:"http://www.matthewkeithsound.com/s/Crypto-Is-For-Small-Businesses_SHORT.mp4",
      full:"http://www.matthewkeithsound.com/s/Crypto-Is-For-Small-Businesses-y4w5.mp4"
    },
    {
      brand:"Pepsi",
      spot:"Press Play On Summer",
      preview:"http://www.matthewkeithsound.com/s/PZS_PPOS_HeroLongform_16x9_OLV_ProRes_SHORT.mp4",
      full:"http://www.matthewkeithsound.com/s/PZS_PPOS_HeroLongform_16x9_OLV_ProRes.mp4"
    },
    // { brand:"Nike", spot:"Run It Back", preview:"https://...", full:"https://..." },
    // ...add more
  ];

  /* 2) Assign 6 random unique picks to faces */
  const FACE_NAMES = ["front","back","right","left","top","bottom"];
  const TARGETS = {
    front:{x:0,y:0}, back:{x:0,y:180},
    right:{x:0,y:90}, left:{x:0,y:-90},
    top:{x:-90,y:0}, bottom:{x:90,y:0}
  };

  function shuffle(a){ const arr=a.slice(); for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
  function sampleUnique(arr,n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
  function randomInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  const PICKS = sampleUnique(MASTER_WORKS, 6);
  const WORKS = {}; // face -> item
  FACE_NAMES.forEach((face, i)=>{
    const item = PICKS[i % PICKS.length];
    WORKS[face] = item;
    const v = document.querySelector(`.${face} video`);
    if(v){ v.src = item.preview; v.load(); v.play().catch(()=>{}); }
  });

  /* 3) Modal */
  const modal = document.getElementById('mkModal');
  const close = document.getElementById('mkClose');
  const mvid  = document.getElementById('mkVid');
  const mbrand= document.getElementById('mkBrand');
  const mspot = document.getElementById('mkSpot');

  function openModalForFace(face){
    const item = WORKS[face]; if(!item) return;
    mbrand.textContent = item.brand || '';
    mspot.textContent  = item.spot  || '';
    mvid.src = item.full;
    mvid.muted = false; mvid.autoplay = true;
    mvid.play().catch(()=>{});
    modal.classList.add('is-open');
  }
  function closeModal(){
    modal.classList.remove('is-open');
    mvid.pause(); mvid.removeAttribute('src'); mvid.load();
  }
  close.addEventListener('click', closeModal);
  modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });

  /* 4) No-repeat queue through all 6 faces */
  let lastFace = null;
  let queue = initQueue();
  let isRolling = false;

  function initQueue(){
    let q = shuffle(FACE_NAMES);
    if(lastFace && q[0] === lastFace){ q.push(q.shift()); }
    return q;
  }

  function roll(){
    if(isRolling) return;
    isRolling = true;

    if(queue.length===0) queue = initQueue();
    const face = queue.shift();
    const t = TARGETS[face];

    const spinsX = randomInt(3,5)*360;
    const spinsY = randomInt(3,5)*360;

    cube.classList.add('is-rolling');
    cube.style.transform = `rotateX(${spinsX + t.x}deg) rotateY(${spinsY + t.y}deg)`;

    setTimeout(()=>{
      cube.classList.remove('is-rolling');
      lastFace = face; isRolling = false;
      openModalForFace(face);
    }, 3200);
  }

  scene.addEventListener('click', roll);
  scene.addEventListener('keydown', e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); roll(); }
  });
})();
</script>
